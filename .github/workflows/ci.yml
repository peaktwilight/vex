name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  vex-tests:
    name: Vex Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.14"

      - name: Run vex unit tests
        run: PYTHONPATH=src python -m unittest discover -s tests

  integration:
    name: Vex Integration
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.14"

      - name: Cache uv downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Install vex + test deps
        run: uv sync --extra dev

      - name: Run integration tests
        env:
          VEX_RUN_INTEGRATION: "1"
        run: uv run pytest tests/integration -m integration -v

  runtime-python-tests:
    name: Runtime Python Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run runtime Python tests
        run: python -m unittest discover -s tests
        working-directory: engine/vex-ai-runtime

  runtime-rust-tests:
    name: Runtime Rust Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run runtime Rust tests
        run: cargo test
        working-directory: engine/vex-ai-runtime
