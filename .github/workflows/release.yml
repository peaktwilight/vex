name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-vex:
    name: Build vex package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build vex distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build

      - name: Upload vex artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vex-dist
          path: dist/*

  build-runtime:
    name: Build runtime wheel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build runtime wheel and sdist
        run: |
          python -m pip install --upgrade pip
          python -m pip install maturin
          maturin build --manifest-path engine/vex-ai-runtime/Cargo.toml --release --out dist-runtime
          python -m build engine/vex-ai-runtime --outdir dist-runtime

      - name: Upload runtime artifacts
        uses: actions/upload-artifact@v4
        with:
          name: runtime-dist
          path: dist-runtime/*

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-vex, build-runtime]
    steps:
      - name: Download vex artifacts
        uses: actions/download-artifact@v4
        with:
          name: vex-dist
          path: release-assets

      - name: Download runtime artifacts
        uses: actions/download-artifact@v4
        with:
          name: runtime-dist
          path: release-assets

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
