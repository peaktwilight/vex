name: Bug report
description: Report a defect in vex or vex-ai-runtime behavior
title: "bug: "
labels:
  - bug
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - vex CLI/workflow
        - engine/vex-ai-runtime
        - shared schema contract
        - docs
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary
      placeholder: What broke?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: OS, Python version, uv version, Rust version
