[project]
name = "local-rag"
version = "0.1.0"
description = "vex example: ollama-backed RAG agent with a naive retriever"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
agent = [
  "pydantic-ai>=0.0.0",
  "pydantic-settings>=2.0",
  "httpx>=0.27",
]
eval = [
  "deepeval>=0.21",
]

[tool.vex]
managed = true
package-mode = false

[tool.vex.python]
prefer-managed = true

[tool.vex.env]
path = ".venv"

[tool.vex.scripts]
dev = "python -m local_rag.main"
benchmark = "python -m local_rag.benchmark"
eval = "python evals/run_eval.py --input {input}"
test = "pytest"
lint = "ruff check ."
format = "ruff format ."
typecheck = "mypy ."

[tool.vex.policy]
sandbox = true
network = "deny"
filesystem = "project"
sandbox_backend = "auto"
sandbox_image = "python:3.12-slim"
sandbox_memory_mb = 1024
sandbox_pids_limit = 128
unsafe_fallback = false

[tool.vex.ai]
template = "agent"
runtime = "vex-ai-runtime"
