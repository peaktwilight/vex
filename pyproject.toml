[project]
name = "vex"
version = "0.1.0"
description = "Bun-inspired workflow tool for Python apps"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
  "mypy>=1.11",
  "pytest>=8.0",
  "ruff>=0.6",
]

[dependency-groups]
test = [
  "pytest>=8.0",
]
# Contract tests verify that vex's argv is still accepted by real external
# tools (docker, gcloud, modal, uvx). The Python-side dep is just pytest —
# modal and gcloud are system binaries provisioned by the CI workflow.
contract = [
  "pytest>=8.0",
]

[project.scripts]
vex = "vex.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Integration and contract tests are opt-in. They are excluded from default
# `pytest tests/` runs and must be selected explicitly with `-m integration`
# / `-m contract` (or by setting VEX_RUN_INTEGRATION=1 / VEX_RUN_CONTRACT=1
# in CI).
addopts = "-m 'not integration and not contract'"
markers = [
  "integration: end-to-end tests that shell out to uv and the real scaffold (deselect with -m 'not integration')",
  "contract: tests that invoke real external tools (docker/gcloud/modal/uvx) against vex-produced argv (deselect with -m 'not contract')",
]

[tool.vex]
managed = true
package-mode = false

[tool.vex.python]
prefer-managed = true

[tool.vex.env]
path = ".venv"

[tool.vex.scripts]
test = "python -m unittest discover -s tests"
lint = "ruff check ."
format = "ruff format ."
typecheck = "mypy src"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"
