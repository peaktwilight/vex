[project]
name = "vex"
version = "0.1.0"
description = "Bun-inspired workflow tool for Python apps"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
  "mypy>=1.11",
  "pytest>=8.0",
  "ruff>=0.6",
]

[dependency-groups]
test = [
  "pytest>=8.0",
]

[project.scripts]
vex = "vex.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Integration tests are opt-in. They are excluded from default `pytest tests/`
# runs and must be selected explicitly with `-m integration` (or by setting
# VEX_RUN_INTEGRATION=1 in CI).
addopts = "-m 'not integration'"
markers = [
  "integration: end-to-end tests that shell out to uv and the real scaffold (deselect with -m 'not integration')",
]

[tool.vex]
managed = true
package-mode = false

[tool.vex.python]
prefer-managed = true

[tool.vex.env]
path = ".venv"

[tool.vex.scripts]
test = "python -m unittest discover -s tests"
lint = "ruff check ."
format = "ruff format ."
typecheck = "mypy src"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"
